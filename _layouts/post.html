---
layout: default
---
<div class="post-glass-box">
  <header class="post-header-section">
    <h1 class="post-title-main">{{ page.title }}</h1>
    <p class="post-meta-info">📅 {{ page.date | date: "%d %B %Y" }} • <span class="badge">{{ page.category }}</span></p>
  </header>

  <div class="post-article-content">
    {{ content }}
  </div>
</div>

<style>
  body {
    background-image: url('{{ site.baseurl }}/1777838696064.png') !important;
    background-size: cover !important;
    background-attachment: fixed !important;
    background-position: center !important;
  }

  .post-glass-box {
    max-width: 800px;
    margin: 40px auto;
    padding: 40px;
    background: rgba(255, 255, 255, 0.9);
    backdrop-filter: blur(15px);
    border-radius: 30px;
    border: 1px solid rgba(255, 255, 255, 0.4);
    box-shadow: 0 20px 40px rgba(0,0,0,0.1);
    font-family: 'Georgia', serif;
  }

  .post-title-main { font-size: 2.5em; color: #4a3728; text-align: center; }
  .post-meta-info { text-align: center; color: #8c7b70; font-style: italic; margin-bottom: 30px; border-bottom: 1px solid #eee; padding-bottom: 20px; }
  .badge { color: #d35400; font-weight: bold; }

  .post-article-content { line-height: 1.8; color: #2c3e50; font-size: 1.1em; }
  .post-article-content p { margin-bottom: 1.5em; }
  
  .post-article-content img {
    max-width: 100%;
    border-radius: 15px;
    display: block;
    margin: 20px auto;
    border: 8px solid white;
    box-shadow: 0 10px 20px rgba(0,0,0,0.1);
  }
</style>
