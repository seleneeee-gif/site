---
layout: default
---
<div style="max-width: 800px; margin: 45px auto; padding: 45px; background: rgba(255, 255, 255, 0.93); backdrop-filter: blur(15px); border-radius: 35px; box-shadow: 0 25px 55px rgba(0,0,0,0.15); border: 1px solid rgba(255,255,255,0.45);">
  <h1 style="font-size: 2.8em; color: #4a3728; text-align: center; margin-bottom: 15px;">{{ page.title }}</h1>
  <p style="text-align: center; color: #8c7b70; font-style: italic; margin-bottom: 35px; border-bottom: 1px solid #eee; padding-bottom: 25px;">
    📅 {{ page.date | date: "%B %d, %Y" }} • <span style="color: #d35400; font-weight: bold; text-transform: uppercase;">{{ page.category }}</span>
  </p>
  <div class="content-area" style="line-height: 2; color: #2c3e50; font-size: 1.2em; text-align: justify;">
    {{ content }}
  </div>
</div>

<style>
  .content-area img {
    max-width: 100%;
    height: auto;
    border-radius: 20px;
    display: block;
    margin: 30px auto;
    border: 8px solid white;
    box-shadow: 0 10px 25px rgba(0,0,0,0.1);
  }
</style>
