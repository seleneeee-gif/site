---
layout: default
---
<div style="max-width: 800px; margin: 0 auto; padding: 50px 20px;">
  <div style="text-align: center; background: rgba(255,255,255,0.5); padding: 40px; border-radius: 20px; margin-bottom: 40px;">
    <h1 style="color: #4a3728; margin: 0;">📜 My Sweet Articles</h1>
  </div>

  {% for post in site.posts %}
  <div style="background: rgba(255,255,255,0.9); margin-bottom: 30px; border-radius: 15px; display: flex; overflow: hidden; height: 200px; box-shadow: 0 10px 20px rgba(0,0,0,0.1);">
    <img src="{{ post.thumbnail }}" style="width: 250px; object-fit: cover;">
    <div style="padding: 25px; display: flex; flex-direction: column; justify-content: center;">
      <a href="{{ post.url | relative_url }}" style="color: #2c3e50; text-decoration: none; font-size: 1.5em; font-weight: bold;">{{ post.title }}</a>
      <p style="color: #666; margin-top: 10px;">{{ post.date | date: "%B %d, %Y" }}</p>
    </div>
  </div>
  {% endfor %}
</div>
