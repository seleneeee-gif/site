---
layout: default
---
<div style="max-width: 800px; margin: 0 auto; padding: 50px 20px;">
  <header style="text-align: center; background: rgba(255,255,255,0.5); padding: 40px; border-radius: 20px; margin-bottom: 40px;">
    <h1 style="color: #4a3728; margin: 0;">📜 My Sweet Articles</h1>
    <p>Art, History & Classic Flavors</p>
  </header>

  <div style="display: flex; flex-direction: column; gap: 30px;">
    {% for post in site.posts %}
    <div style="background: rgba(255,255,255,0.95); border-radius: 15px; display: flex; overflow: hidden; height: 180px; box-shadow: 0 10px 20px rgba(0,0,0,0.1);">
      <img src="{{ post.thumbnail }}" style="width: 250px; object-fit: cover;">
      <div style="padding: 20px; display: flex; flex-direction: column; justify-content: center;">
        <span style="color: #d35400; font-weight: bold; font-size: 0.8em; text-transform: uppercase;">{{ post.category }}</span>
        <a href="{{ post.url | relative_url }}" style="color: #2c3e50; text-decoration: none; font-size: 1.4em; font-weight: bold;">{{ post.title }}</a>
        <p style="color: #888; font-size: 0.9em; margin-top: 5px;">{{ post.date | date: "%B %d, %Y" }}</p>
      </div>
    </div>
    {% endfor %}
  </div>
</div>
