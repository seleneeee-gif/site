---
layout: default
---
<!DOCTYPE html>
<html>
<head>
    <style>
        body { 
            /* Arka plan resmini en güvenli şekilde tanımlıyoruz */
            background-image: url('1777838696064.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            background-color: #fdf5e6; 
            margin: 0;
            font-family: 'Georgia', serif;
            min-height: 100vh;
        }

        .page-container { max-width: 950px; margin: 0 auto; padding: 40px 20px; position: relative; z-index: 1; }
        
        .site-header { 
            text-align: center; 
            margin-bottom: 70px; 
            padding: 50px;
            background: rgba(255, 255, 255, 0.5); /* Biraz daha şeffaf yaptık ki Mona Lisa görünsün */
            border-radius: 30px;
            backdrop-filter: blur(8px); 
            border: 1px solid rgba(255,255,255,0.3);
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }
        .site-header h1 { font-size: 3.8em; color: #4a3728; margin-bottom: 10px; font-weight: bold; }
        .site-header p { font-style: italic; color: #6d5b4e; font-size: 1.3em; }
        
        .post-list { list-style: none; padding: 0; }
        .post-card { 
            background: rgba(255, 255, 255, 0.92); 
            margin-bottom: 40px; 
            border-radius: 25px; 
            box-shadow: 0 10px 40px rgba(0,0,0,0.08); 
            display: flex; 
            overflow: hidden; 
            height: 280px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            transition: 0.3s ease;
        }
        .post-card:hover { transform: translateY(-8px); box-shadow: 0 15px 50px rgba(0,0,0,0.15); }

        .post-thumbnail { 
            width: 320px; height: 100%; object-fit: cover; flex-shrink: 0;
            border-right: 1px solid #f1e4d1;
        }

        .post-content { padding: 40px; display: flex; flex-direction: column; justify-content: center; flex-grow: 1; }
        
        .category-tag { 
            display: inline-block; padding: 8px 16px; border-radius: 20px; 
            font-size: 0.75em; text-transform: uppercase; font-weight: bold; margin-bottom: 15px;
        }
        .tag-art { background: #f4ecf7; color: #8e44ad; border: 1px solid #dcd0e0; }
        .tag-recipe { background: #fff5e6; color: #d35400; border: 1px solid #f7e6cc; }

        .post-link { color: #2c3e50; text-decoration: none; font-size: 1.8em; font-weight: bold; line-height: 1.2; }
        .post-link:hover { color: #d35400; }
        .post-date { color: #999; margin-top: 15px; font-style: italic; font-size: 0.9em; }
    </style>
</head>
<body>
    <div class="page-container">
        <div class="site-header">
            <h1>📜 My Sweet Articles</h1>
            <p>Sanat, Kültür ve Tatlı Bir Serüven</p>
        </div>

        <ul class="post-list">
            {% for post in site.posts %}
            <li>
                <div class="post-card">
                    <img src="{{ post.thumbnail }}" alt="{{ post.title }}" class="post-thumbnail">
                    <div class="post-content">
                        <div>
                            {% if post.category == 'Art' %}
                                <span class="category-tag tag-art">🎨 Sanat & Kültür</span>
                            {% else %}
                                <span class="category-tag tag-recipe">🍮 Tatlı Tarifi</span>
                            {% endif %}
                            <br>
                            <a class="post-link" href="{{ post.url | relative_url }}">{{ post.title }}</a>
                        </div>
                        <div class="post-date">📅 {{ post.date | date: "%d %B %Y" }}</div>
                    </div>
                </div>
            </li>
            {% endfor %}
        </ul>
    </div>
</body>
</html>
